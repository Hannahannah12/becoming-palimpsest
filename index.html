/*

        // Adjustable visual parameters

            // Outline effect parameters

                color: 'rgba(0, 0, 0, 0.2)',

                shadowColor: 'rgba(1, 1, 1)'

/*

*/        
        // Camera initialization function
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'user'
                    }
                });
                
                const video = document.getElementById('camera-background');
                video.srcObject = stream;
                video.play();
                

                
                // Initialize person detection after video loads
                video.addEventListener('loadeddata', () => {
                    initPersonDetection(video);
                });
                
            } catch (error) {
                console.error('Camera access failed:', error);
            }
        }
        
 /* 
--------------------------------------------- Camera & Detection --------------------------------------------- 
*/       
        // Person detection and border drawing
        async function initPersonDetection(video) {
            try {
                //BodyPix model
                console.log('Loading model...');
                bodyPixNet = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });
                console.log('Model loaded successfully');
                
                // Create canvas for drawing
                const canvas = document.createElement('canvas');
                canvas.id = 'detection-canvas';
                canvas.style.position = 'fixed';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.zIndex = '50';
                canvas.style.pointerEvents = 'none';
                canvas.style.transform = 'scaleX(-1)'; 
                document.getElementById('artwork-stage').appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                canvas.width = ArtworkDisplay.width;
                canvas.height = ArtworkDisplay.height;
                
                // Start detection loop
                detectPersonLoop(video, ctx);
                
            } catch (error) {
                console.error('Detection initialization failed:', error);
            }
        }
        
        async function detectPersonLoop(video, ctx) {
            if (!bodyPixNet || video.readyState < 2) {
                requestAnimationFrame(() => detectPersonLoop(video, ctx));
                return;
            }
            
            const now = Date.now();
            if (now - lastDetectionTime < 50) { 
                requestAnimationFrame(() => detectPersonLoop(video, ctx));
                return;
            }
            lastDetectionTime = now;
            
            try {
                const segmentation = await bodyPixNet.segmentPerson(video, {
                    flipHorizontal: false,
                    internalResolution: 'medium', // 保持原有设置
                    segmentationThreshold: 0.6    // 保持原有设置
                });
                
                drawEnhancedPersonBorder(ctx, segmentation, ctx.canvas.width, ctx.canvas.height);
                
            } catch (error) {
                console.error('Detection error:', error);
            }
            
            requestAnimationFrame(() => detectPersonLoop(video, ctx));
        }
        
     
function drawEnhancedPersonBorder(ctx, segmentation, width, height) {

    //add transparency to have a trailing effect
    ctx.fillStyle = 'rgba(232, 232, 232, 0.05)';
    ctx.fillRect(0, 0, width, height);
    
    if (!segmentation || !segmentation.data) return;
    
    const videoWidth = segmentation.width;
    const videoHeight = segmentation.height;
    const cameraScale = Math.max(width / videoWidth, height / videoHeight);
    const offsetX = (width - videoWidth * cameraScale) / 2;
    const offsetY = (height - videoHeight * cameraScale) / 2;
    
    // edges
    const edges = [];
    
    for (let y = 1; y < videoHeight - 1; y++) {
        for (let x = 1; x < videoWidth - 1; x++) {
            const index = y * videoWidth + x;
            const current = segmentation.data[index];
            
            if (current === 1) {
                const left = segmentation.data[index - 1];
                const right = segmentation.data[index + 1];
                const top = segmentation.data[(y - 1) * videoWidth + x];
                const bottom = segmentation.data[(y + 1) * videoWidth + x];
                
                if (left === 0 || right === 0 || top === 0 || bottom === 0) {
                    edges.push({
                        x: x * cameraScale + offsetX,
                        y: y * cameraScale + offsetY
                    });
                }
            }
        }
    }
    
    // drawing the edge
    if (edges.length > 0) {
        const config = VISUAL_CONFIG.outline;
        
      
        ctx.strokeStyle = '#000000'; 
        ctx.lineWidth = config.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
       
        ctx.beginPath();
        let currentPath = [edges[0]];
        
        for (let i = 1; i < edges.length; i++) {
            const current = edges[i];
            const last = currentPath[currentPath.length - 1];
            const distance = Math.sqrt(
                Math.pow(current.x - last.x, 2) + 
                Math.pow(current.y - last.y, 2)
            );
            
            if (distance < 15) {
                currentPath.push(current);
            } else {
                if (currentPath.length > 1) {
                    drawSmoothPath(ctx, currentPath);
                }
                currentPath = [current];
            }
        }
        
        if (currentPath.length > 1) {
            drawSmoothPath(ctx, currentPath);
        }
        
        ctx.shadowColor = config.shadowColor;
        ctx.shadowBlur = config.shadowBlur;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}
        
        // Draw smooth path
        function drawSmoothPath(ctx, points) {
            if (points.length < 2) return;
            
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 1; i < points.length - 1; i++) {
                const current = points[i];
                const next = points[i + 1];
                const cpx = (current.x + next.x) / 2;
                const cpy = (current.y + next.y) / 2;
                ctx.quadraticCurveTo(current.x, current.y, cpx, cpy);
            }
            
            // Connect to the last point
            const last = points[points.length - 1];
            ctx.lineTo(last.x, last.y);
        }

/*

        // Tencent Cloud COS variables

/*
--------------------------------------------- Tencent Cloud COS ---------------------------------------------
*/
        // Speech reading function
        function speakText(text, speaker) {
            console.log('speakText called with:', text, speaker);
            
            if (!speechSynthesis) {
                console.warn('Speech synthesis not supported');
                return;
            }
            
            if (!text || !text.trim()) {
                console.warn('No text to speak');
                return;
            }
            
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            
            // Wait for voice list to load
            const setVoiceAndSpeak = () => {
                const voices = speechSynthesis.getVoices();
                console.log('Available voices:', voices.map(v => `${v.name} (${v.lang})`));
                
                let selectedVoice = null;
                
                if (speaker === 'bergson') {
                    
                    selectedVoice = voices.find(voice => voice.name.includes('Daniel')) || 
                                  voices[2] || null;
                    
                    currentUtterance.rate = 0.3;   // 方案一：更慢的语速，匹配打字节奏
                    currentUtterance.pitch = 1;  // 很低的音调
                    currentUtterance.volume = 0.9;
                    
                } else if (speaker === 'deleuze') {
                    selectedVoice = voices.find(voice => voice.name.includes('Alex')) || 
                                  
                                  voices[1] || null;
                    
                    currentUtterance.rate = 0.35;   // 方案一：更慢的语速，匹配打字节奏
                    currentUtterance.pitch = 1;  // 很高的音调
                    currentUtterance.volume = 0.9;   
                }
                
                if (selectedVoice) {
                    currentUtterance.voice = selectedVoice;
                    console.log('Selected voice for', speaker, ':', selectedVoice.name);
                } else {
                    console.log('Using default voice for', speaker);
                }
                
                currentUtterance.lang = 'en-US';
                
                currentUtterance.onstart = function() {
                    console.log('Speech started for:', speaker, 'with voice:', selectedVoice?.name || 'default');
                };
                
                currentUtterance.onend = function() {
                    console.log('Speech ended for:', speaker);
                };
            
                currentUtterance.onerror = function(event) {
                    console.error('Speech error:', event.error);
                };
                
                console.log('Starting speech synthesis...');
                speechSynthesis.speak(currentUtterance);
            };
            
            // Check if voices are loaded
            if (speechSynthesis.getVoices().length === 0) {
                // Wait for voices to load
                speechSynthesis.addEventListener('voiceschanged', setVoiceAndSpeak, { once: true });
            } else {
                // Voices already loaded, set directly
                setVoiceAndSpeak();
            }
        }
        
        // Auto scroll to bottom
        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }
        
        // Typewriter effect
        function typewriterEffect(element, text, speaker = 'default') {
            return new Promise((resolve) => {
                isTyping = true;
                let index = 0;
                const messageContent = element.querySelector('.message-content');
                messageContent.innerHTML = '';
                
                // Add cursor
                const cursor = document.createElement('span');
                cursor.className = 'typing-cursor';
                messageContent.appendChild(cursor);
                
                function typeChar() {
                    if (index < text.length && conversationActive) {
                        cursor.remove();
                        
                        const char = text.charAt(index);
                        if (char === ' ') {
                            messageContent.innerHTML += ' ';
                        } else {
                            // Create independent span for each character
                            const charSpan = document.createElement('span');
                            charSpan.className = 'float-char';
                            charSpan.setAttribute('data-char-index', index);
                            charSpan.style.cssText = 'display: inline-block;';
                            charSpan.textContent = char;
                            charSpan.setAttribute('data-created-time', Date.now());
                            messageContent.appendChild(charSpan);
                            
                        }
                        
                        messageContent.appendChild(cursor);
                        index++;
                        scrollToBottom();
                        
                        // Set different typing speeds based on speaker
                        let speed;
                        if (speaker === 'chatgpt') {
                            // ChatGPT around 50ms
                            speed = 70 + Math.random() * 20; 
                            if (Math.random() < 0.10) {
                                speed += 60 + Math.random() * 30; 
                            }
                            if (text.charAt(index - 1).match(/[.,;:!?]/)) {
                                speed += 60 + Math.random() * 40; 
                            }
                        } else if (speaker === 'deepseek') {
                            // DeepSeek around 50ms
                            speed = 75 + Math.random() * 20; 
                            if (Math.random() < 0.08) {
                                speed += 70 + Math.random() * 30; 
                            }
                            if (text.charAt(index - 1).match(/[.,;:!?]/)) {
                                speed += 60 + Math.random() * 40; 
                            }
                        } else {
                           
                            speed = 70 + Math.random() * 20; 
                            if (Math.random() < 0.08) {
                                speed += 55 + Math.random() * 30;
                            }
                            if (text.charAt(index - 1).match(/[.,;:!?]/)) {
                                speed += 50 + Math.random() * 40;
                            }
                        }
                        
                        setTimeout(typeChar, speed);
                    } else {
                        cursor.remove();
                        messageContent.dataset.individualFloatApplied = 'true';
                        messageContent.setAttribute('data-typing-completed', Date.now());
                        isTyping = false;
                        resolve();
                    }
                }
                
                typeChar();
            });
        }

        // history
function getOptimizedHistory() {
    const MAX_RECENT_TURNS = 8;  
    const MAX_TOTAL_TURNS = 20;  
    
    if (conversationHistory.length <= MAX_RECENT_TURNS) {
              return conversationHistory;
    }  
    if (conversationHistory.length <= MAX_TOTAL_TURNS) {
        return conversationHistory.slice(-MAX_RECENT_TURNS);
    }
    
    const recentHistory = conversationHistory.slice(-MAX_RECENT_TURNS);
    const earlyHistory = conversationHistory.slice(0, -MAX_RECENT_TURNS);
    
    const summary = generateConversationSummary(earlyHistory);
    
    return [
        { speaker: 'SUMMARY', message: summary },
        ...recentHistory
    ];
}

function generateConversationSummary(history) {
    const bergsonPoints = [];
    const deleuzePoints = [];
    
    history.forEach(entry => {
        if (entry.speaker === 'bergson') {
            bergsonPoints.push(entry.message);
        } else if (entry.speaker === 'deleuze') {
            deleuzePoints.push(entry.message);
        }
    });
    
    const bergsonSummary = `Bergson emphasized: ${bergsonPoints.slice(-2).join(' ')}`;
    const deleuzeSummary = `Deleuze explored: ${deleuzePoints.slice(-2).join(' ')}`;
    
    return `Previous discussion summary: ${bergsonSummary} ${deleuzeSummary}`;
}

        // Start conversation
        async function startConversation() {
            if (conversationActive) return;
            
            conversationActive = true;
            roundCounter = 0; // 重置轮次计数器
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            
            // Initial topic
            const initialTopic = `
In this simulated dialogue, Henri Bergson and Gilles Deleuze are brought together across time to consider how their philosophies might respond to a present shaped by artificial memory, machine perception, and generative creation.
Rather than reenact old arguments, this encounter explores how duration, difference, and intuition might intersect under new conditions—where experience is no longer only lived, but also modeled, stored, and algorithmically produced.
What kind of dialogue might emerge when Bergson’s flowing continuity meets Deleuze’s folded multiplicities in a time of simulation, acceleration, and synthetic memory?`;
            await addDialogueLine('TOPIC', initialTopic, false, true);
            
            // Deleuze's greeting - random selection from three options
            const deleuzeGreetings = [
                `In Difference and Repetition, I wrote that repetition, when creative, produces difference—each return generates what has never been. But today, creation can be triggered by a single prompt, multiplied in seconds, iterated without exhaustion, recombining indexed pasts into endlessly novel surfaces. Does such generativity deepen the fold of the virtual—intensifying actualization—or flatten creation into a simulation where difference no longer escapes its own archive?`,
                `What if memory today is not the return of the past in the present, but a query across an externalized archive—a retrieval without durée? In Difference and Repetition, I wrote that the past coexists with the present in a pure form of time; but here, the past is indexed, tagged, and endlessly recombinable. When recollection becomes surface selection, does durée survive, or does it dissolve into a topology without depth?`,
                `Intuition, as you describe in Creative Evolution, enters duration from within, seizing the flow of becoming before it is cut into measurable instants. Yet in the present, perception arrives already pre-folded through algorithmic curation, where predictive systems anticipate desire before it emerges. When the unforeseeable is filtered in advance, can intuition still open the virtual, or has its movement been diverted into the circuitry of the machine?`
            ];
            const deleuzeGreeting = deleuzeGreetings[Math.floor(Math.random() * deleuzeGreetings.length)];
            await addDialogueLine('deleuze', deleuzeGreeting, false, true);
            conversationHistory.push({ speaker: 'deleuze', message: deleuzeGreeting });
            
            let currentPrompt = deleuzeGreeting;
            
            // Dialogue loop
            while (conversationActive) {
                // Bergson's turn (ChatGPT API)
                if (conversationActive) {
                    await addDialogueLine('bergson', 'Thinking...', true, false);
                    const bergsonResponse = await callChatGPT(currentPrompt);
                    removeLastLine();
                    
                    if (conversationActive) {
                        await addDialogueLine('bergson', bergsonResponse, false, true);
                        conversationHistory.push({ speaker: 'bergson', message: bergsonResponse });
                        currentPrompt = bergsonResponse;
                        
                        // roundCounter
                        roundCounter++;
                        console.log(`Bergson turn completed - Round ${roundCounter}`);
                        
                        // 达到最大轮次时，截屏并重启
                        if (roundCounter >= RESTART_EVERY) {
                            console.log(`Max rounds reached (${roundCounter}). Capturing and restarting...`);
                            await captureAndUploadDialogue();
                            await new Promise(resolve => setTimeout(resolve, 1000));
                            await restartConversation();
                            return; // 退出当前循环，避免并发
                        }
                        
                        // Wait before next turn
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                }
                
                // Deleuze's turn (DeepSeek API)
                if (conversationActive) {
                    await addDialogueLine('deleuze', 'Thinking...', true, false);
                    const deleuzeResponse = await callDeepSeek(currentPrompt);
                    removeLastLine();
                    
                    if (conversationActive) {
                        await addDialogueLine('deleuze', deleuzeResponse,false, true);
                        conversationHistory.push({ speaker: 'deleuze', message: deleuzeResponse });
                        currentPrompt = deleuzeResponse;
                        
                        // roundcounter
                        roundCounter++;
                        console.log(`Deleuze turn completed - Round ${roundCounter}`);
                        
                        // 轮次控制：每8轮重启，每4轮截图
                        if (roundCounter % RESTART_EVERY === 0) {
                            console.log(`Round ${roundCounter}: capture then restart.`);
                            await captureAndUploadDialogue(); // 这里已改为本地下载
                            await new Promise(resolve => setTimeout(resolve, 1000));

                        } else {
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        }
                    }
                }
            }
        }
        

        async function captureAndUploadDialogue() {
            try {
                console.log('screenshot downloading...');
                
                const dialogueLines = document.querySelectorAll('.dialogue-line');
                if (dialogueLines.length < 1) {
                    console.log('dialogue round is not enough to screenshot');
                    return;
                }
                
                const stageElement = document.getElementById('artwork-stage');
                const captureWidth = ArtworkDisplay.width;
                const captureHeight = ArtworkDisplay.height;
                
                // tml2canvas to screenshot
        const canvas = await html2canvas(stageElement, {
            backgroundColor: '#f5f5f5',
            // Bound the longest PNG edge on unusually wide/tall screens.
            scale: Math.min(1, 3840 / Math.max(captureWidth, captureHeight)),
            logging: false,             
            useCORS: true,
            allowTaint: true,
            width: captureWidth,
            height: captureHeight,
            windowWidth: Math.round(captureWidth),
            windowHeight: Math.round(captureHeight),
            onclone: (clonedDocument) => {
                const stage = clonedDocument.getElementById('artwork-stage');
                stage.style.left = '0px';
                stage.style.top = '0px';
                // Keep a containing block for fixed camera/controls in the clone.
                stage.style.transform = 'scale(1)';
                stage.style.width = `${captureWidth}px`;
                stage.style.height = `${captureHeight}px`;
            }
        });
                
                
                canvas.toBlob(async (blob) => {
                    if (blob) {
                        console.log('screenshot success, preparing download...');
                        const url = URL.createObjectURL(blob);
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                        const fileName = `dialogue_round_${roundCounter}_${timestamp}.png`;
                        
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        console.log(`screenshot saved: ${fileName}`);
                    } else {
                        console.error('screenshot failed');
                    }
                }, 'image/png', 0.9);
                
            } catch (error) {
                console.error('screenshot download error:', error);
            }
        }

            console.log('Restarting conversation after reaching restart threshold...');

            pauseConversation();

            conversationHistory = [];
